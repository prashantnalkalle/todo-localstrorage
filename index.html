<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
	<link rel="stylesheet" href="./assests/css/style.css">
</head>
<body>
	<div class="container mt-5">
		<h1>Todo List</h1>
		<div class="row">
			<div class="col-md-6">
				<div class="card">
					<div class="card-body">
						<form action="" id="todoform">
							<div class="form-group"> 
							<label for="todoitem sr-only">Add item</label>
							<input type="text" class="form-control" id="todoitem">
							
							</div>
							<button  id="addtodo" type="submit" class="btn btn-outline-primary btn-block btn-sm"> Add Todo</button>
							<button id="updatetodo" type='button' class=" d-none btn btn-outline-primary btn-block btn-sm"> Update Todo</button>

						</form>
					</div>
				</div>

			</div>
			<div class="col-md-6">
				<div class="card">
					<div class="card-body">
						<ul class="list-group" id="todocontainer">
				
				
						</ul>
					</div>
				</div>

			</div>

		</div>
	</div>
	
	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
	<script src="./assests/js/app.js"></script>
</body>
</html>
